<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Carved Pumpkin Front</title>
  <rect width="16" height="16" fill="#c9711b"/>
  <rect x="1" y="0" width="2" height="16" fill="#b55e14"/>
  <rect x="5" y="0" width="2" height="16" fill="#d9823a"/>
  <rect x="9" y="0" width="2" height="16" fill="#b55e14"/>
  <rect x="13" y="0" width="2" height="16" fill="#d9823a"/>
  <rect x="0" y="0" width="16" height="1" fill="#a15110"/>
  <rect x="0" y="15" width="16" height="1" fill="#9a4c0f"/>
  <!-- Glowing inner face, dark -->
  <rect x="0" y="2" width="16" height="12" fill="#3a1f0a"/>
  <!-- Left eye triangle -->
  <polygon points="1,3 4,3 4,6 1,6" fill="#ffd23e"/>
  <polygon points="1,3 2,3 3,4 3,6 1,6" fill="#ffbb00"/>
  <!-- Right eye triangle -->
  <polygon points="12,3 15,3 15,6 12,6" fill="#ffd23e"/>
  <polygon points="13,3 14,3 14,6 12,6" fill="#ffbb00"/>
  <!-- Zigzag mouth -->
  <polygon points="2,9 3.5,7 5,9 6.5,7 8,9 9.5,7 11,9 12.5,7 14,9 14,12 2,12" fill="#ffd23e"/>
  <polygon points="2,9 3,11 5,9 6.5,11 8,9 9.5,11 11,9 12.5,11 14,9" fill="#ffbb00"/>
  <!-- Nose -->
  <polygon points="7,5 9,5 8,7" fill="#ffd23e"/>
  <!-- Inner glow highlight -->
  <rect x="3" y="10" width="2" height="1" fill="#fff3b0"/>
</svg>
