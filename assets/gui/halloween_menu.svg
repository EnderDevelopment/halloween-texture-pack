<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <title>Halloween 2026 Main Menu</title>
  <!-- Night sky background -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f2e"/>
      <stop offset="1" stop-color="#241538"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="30" cy="20" r="1.2"/>
    <circle cx="70" cy="40" r="0.8"/>
    <circle cx="120" cy="15" r="1"/>
    <circle cx="180" cy="30" r="1.4"/>
    <circle cx="220" cy="12" r="0.8"/>
    <circle cx="270" cy="45" r="1.1"/>
    <circle cx="300" cy="22" r="0.9"/>
    <circle cx="150" cy="55" r="0.7"/>
    <circle cx="90" cy="70" r="0.9"/>
    <circle cx="250" cy="60" r="1"/>
  </g>

  <!-- Moon with crater -->
  <circle cx="250" cy="48" r="24" fill="#f2ead0"/>
  <circle cx="243" cy="44" r="4" fill="#d9cfae"/>
  <circle cx="258" cy="53" r="3" fill="#d9cfae"/>
  <circle cx="248" cy="56" r="2.4" fill="#d9cfae"/>

  <!-- Bats -->
  <g fill="#170d22">
    <path d="M30 100 q4 -5 8 0 q-1 3 -4 2 q0 3 -4 -2 z"/>
    <path d="M30 100 q4 -4 8 0 q-1 2 -3 1 q0 3 -5 -1 z"/>
    <path d="M140 90 q5 -6 10 0 q-2 4 -5 2 q0 4 -5 -2 z"/>
    <path d="M140 90 q5 -5 10 0 q-1 3 -4 1 q0 4 -6 -1 z"/>
    <path d="M200 110 q3 -4 6 0 q-1 2 -3 1 q0 3 -3 -1 z"/>
  </g>

  <!-- Ground hill -->
  <path d="M0 150 Q80 120 160 145 Q250 118 320 150 L320 180 L0 180 Z" fill="#1c2417"/>
  <path d="M0 158 Q110 135 200 153 Q280 142 320 158 L320 180 L0 180 Z" fill="#141a10"/>

  <!-- Graveyard: tombstones -->
  <g>
    <rect x="60" y="140" width="14" height="22" fill="#6a6f78"/>
    <path d="M60 140 a7 7 0 0 1 14 0" fill="#6a6f78"/>
    <text x="67" y="154" font-family="serif" font-size="9" fill="#3d4148" text-anchor="middle">RIP</text>
    <rect x="150" y="135" width="12" height="26" fill="#7b8089"/>
    <path d="M150 135 a6 6 0 0 1 12 0" fill="#7b8089"/>
    <text x="156" y="150" font-family="serif" font-size="8" fill="#4a4e55" text-anchor="middle">2026</text>
    <rect x="230" y="142" width="13" height="20" fill="#5f646d"/>
    <path d="M230 142 a6.5 6.5 0 0 1 13 0" fill="#5f646d"/>
  </g>

  <!-- Hidden glowing pumpkins in the field -->
  <g>
    <rect x="30" y="163" width="10" height="8" fill="#c9711b"/>
    <rect x="30" y="163" width="3" height="3" fill="#ffbb00"/>
    <rect x="36" y="163" width="3" height="3" fill="#ffbb00"/>
    <rect x="31" y="167" width="7" height="2" fill="#ffbb00"/>
    <rect x="96" y="160" width="9" height="7" fill="#b55e14"/>
    <rect x="96" y="160" width="3" height="3" fill="#ffd23e"/>
    <rect x="101" y="160" width="3" height="3" fill="#ffd23e"/>
    <rect x="97" y="164" width="6" height="2" fill="#ffd23e"/>
  </g>

  <!-- Wandering ghost -->
  <path d="M285 150 q0 -8 7 -8 q7 0 7 8 l0 6 l-2 -2 l-2 2 l-2 -2 l-2 2 l-2 -2 l-2 2 l-2 -2 z" fill="#dfe6ee"/>
  <circle cx="290" cy="146" r="1.3" fill="#1b1f26"/>
  <circle cx="296" cy="146" r="1.3" fill="#1b1f26"/>

  <!-- Fog wisps -->
  <g fill="#dfe6ee" opacity="0.12">
    <ellipse cx="80" cy="170" rx="50" ry="8"/>
    <ellipse cx="210" cy="172" rx="60" ry="7"/>
  </g>

  <!-- Title banner -->
  <g>
    <rect x="70" y="66" width="180" height="18" fill="#1a0f24" opacity="0.75" rx="3"/>
    <text x="160" y="79" font-family="serif" font-size="16" font-weight="bold"
          fill="#ffb400" text-anchor="middle" letter-spacing="2">HALLOWEEN 2026</text>
  </g>
</svg>
